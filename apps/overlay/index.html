<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>RoastBot Overlay</title>
  </head>
  <body>
    <main id="stage" aria-live="polite">
      <section id="roast" hidden>
        <img id="character" alt="" hidden />
        <article class="card">
          <div class="orb">R</div>
          <div class="body">
            <p class="meta"><span id="viewer"></span><span id="verdict" hidden></span></p>
            <blockquote id="text"></blockquote>
          </div>
          <span class="wave" aria-hidden><i></i><i></i><i></i><i></i></span>
        </article>
      </section>
      <button id="recover" hidden>🔊 Нажми, чтобы включить звук RoastBot</button>
      <p id="connection">Подключение…</p>
    </main>
    <audio id="audio" preload="auto"></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
