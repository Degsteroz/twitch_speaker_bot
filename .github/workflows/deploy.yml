name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: roastbot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: type-aware lint and the tests resolve workspace packages through dist/.
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      # Includes integration tests against an embedded PostgreSQL 16 (no service container needed).
      - run: pnpm test
      - run: pnpm --filter @roastbot/web build
      - run: pnpm --filter @roastbot/overlay build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/tts/requirements.txt
      - run: pip install -r services/tts/requirements.txt httpx
      - run: pnpm --filter @roastbot/tts build
      - run: python -m unittest discover -s tests -t .
        working-directory: services/tts

  images:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: services/api/Dockerfile
          - image: worker
            dockerfile: services/worker/Dockerfile
          - image: twitch
            dockerfile: services/twitch/Dockerfile
          - image: tts
            dockerfile: services/tts/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: overlay
            dockerfile: apps/overlay/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # GHCR repository names must be lowercase; the owner login is not (Degsteroz).
      - run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/roastbot-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/roastbot-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      GHCR_USER: ${{ secrets.GHCR_USER }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
    steps:
      - id: gate
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] &&
             [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_PATH" ] &&
             [ -n "$GHCR_USER" ] && [ -n "$GHCR_READ_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SSH deploy skipped: production secrets are incomplete"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: appleboy/ssh-action@v1.2.2
        if: steps.gate.outputs.enabled == 'true'
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          RELEASE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_READ_TOKEN,RELEASE_TAG,DEPLOY_PATH
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG="$RELEASE_TAG"
            docker compose --env-file deploy/.env -f deploy/docker-compose.yml pull
            docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --remove-orphans
            docker image prune -f
