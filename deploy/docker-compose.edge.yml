# Edge mode: a VPS where another project's Caddy already owns 80/443 (here: purrse-web).
# Nothing is published on the host. Our Caddy joins the shared Docker network `edge` under the
# fixed name `roastbot-edge` and serves plain HTTP on :8080; the front Caddy terminates TLS for
# roast.recursia.online and forwards to it. Images come ready from GHCR (CI builds them on
# every push to main), tagged with the commit the server checked out:
#
#   ./deploy/edge-deploy.sh            # pull the images of the current commit and restart
#   BUILD=1 ./deploy/edge-deploy.sh    # build here instead, one image at a time (slow, 2 GB RAM)
#
# Image names are the base file's ghcr.io/${GHCR_OWNER}/roastbot-*:${IMAGE_TAG}; a local build
# tags the same names. Needs Docker Compose 2.24+ (`!reset` / `!override`).

services:
  postgres:
    # Small VPS: smaller shared buffers than the 128 MB default.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=60"]
    mem_limit: 256m

  api:
    mem_limit: 256m

  worker:
    mem_limit: 256m

  twitch:
    mem_limit: 192m

  tts:
    environment:
      # Load a voice on first use instead of both at start: only voices streamers pick use RAM.
      PRELOAD_VOICES: "false"
    mem_limit: 640m

  web:
    mem_limit: 48m

  overlay:
    mem_limit: 48m

  caddy:
    container_name: roastbot-edge
    ports: !reset []
    volumes:
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
    networks: !override [internal, edge]
    mem_limit: 64m

networks:
  # Created once by the purrse stack: docker network create edge
  edge:
    external: true
