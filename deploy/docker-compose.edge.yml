# Edge mode: a VPS where another project's Caddy already owns 80/443 (here: purrse-web).
# Nothing is published on the host. Our Caddy joins the shared Docker network `edge` under the
# fixed name `roastbot-edge` and serves plain HTTP on :8080; the front Caddy terminates TLS for
# roast.recursia.online and forwards to it. Images are built on the server, one at a time:
#
#   ./deploy/edge-deploy.sh
#
# Needs Docker Compose 2.24+ (`!reset` / `!override`).

# Images are built on this server and never pulled. The `localhost/` prefix keeps a stray
# `docker compose pull` from fetching a same-named image from Docker Hub.
x-local-build: &local-build
  pull_policy: never

services:
  postgres:
    # Small VPS: smaller shared buffers than the 128 MB default.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=60"]
    mem_limit: 256m

  migrate:
    image: localhost/roastbot-api:edge
    <<: *local-build

  api:
    image: localhost/roastbot-api:edge
    <<: *local-build
    mem_limit: 256m

  worker:
    image: localhost/roastbot-worker:edge
    <<: *local-build
    mem_limit: 256m

  twitch:
    image: localhost/roastbot-twitch:edge
    <<: *local-build
    mem_limit: 192m

  tts:
    image: localhost/roastbot-tts:edge
    <<: *local-build
    environment:
      # Load a voice on first use instead of both at start: only voices streamers pick use RAM.
      PRELOAD_VOICES: "false"
    mem_limit: 640m

  web:
    image: localhost/roastbot-web:edge
    <<: *local-build
    mem_limit: 48m

  overlay:
    image: localhost/roastbot-overlay:edge
    <<: *local-build
    mem_limit: 48m

  caddy:
    container_name: roastbot-edge
    ports: !reset []
    volumes:
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
    networks: !override [internal, edge]
    mem_limit: 64m

networks:
  # Created once by the purrse stack: docker network create edge
  edge:
    external: true
